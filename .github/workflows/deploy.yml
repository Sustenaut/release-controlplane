# Build and deploy the app (release.sustenaut.eu) once CI passes on a merge to main,
# or by hand, with pubkit's k8s-deploy.yml (pubkit's README, "Deploying a service to
# k3s"). The image goes to GitHub's container registry and holds no secrets. Then the
# manifests in k8s/, rendered with that image, go to the Sustenaut k3s server
# (shared-infra's infra/hetzner.tf) over SSH and the tailnet, where the deploy key can
# only run sustenaut-deploy: apply in namespace release and wait, once DEPLOY_RELEASE
# is on, which the deploy walk sets once every need before it is ready. k8s-schryer/,
# schryer's deployment, goes to release-schryer once DEPLOY_SCHRYER is on, when its
# namespace and Secrets are on the server.
#
# The deploy secrets and variables are in this repository's server environment, which
# only main may use, because this repository is public. Without SUSTENAUT_SERVER the
# image is built and pushed, and nothing is deployed.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubkit/.github/workflows/k8s-deploy.yml@01c2711869ce046ec875edee83e575b955cfbabf # v0.31.3
    with:
      image: ghcr.io/sustenaut/sustenaut-release
      deploys: |
        k8s release DEPLOY_RELEASE
        k8s-schryer release-schryer DEPLOY_SCHRYER
      # The image must start and hold what the app imports, and no tests.
      check: |
        docker run --rm "$IMAGE" node -e '
          import("./app/server.js").then(() => import("pubpr")).then(() => {
            if (require("node:fs").existsSync("app/test")) throw new Error("tests in the image");
          })'
    secrets: inherit
