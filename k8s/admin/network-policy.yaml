# Applied by push-secrets.sh over the admin key: the deploy identity may not manage
# network policies. k3s enforces them (kube-router). The app trusts the email header
# the proxy sets, so only the proxy's pods may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-only-from-proxy
  namespace: release
spec:
  podSelector:
    matchLabels:
      app: release
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - port: 8080
