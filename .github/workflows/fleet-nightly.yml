# Every night: pubfleet's nightly on what Sustenaut's state.json governs.
# 02:41 UTC. pubfleet's nightly has no schedule of its own, so this is the only one that runs it.
# It also reports any GitHub variable that differs from what release-state gives it, and
# keeps each repository's checks against pubkit as facts for observability.
name: nightly

on:
  schedule: [{ cron: '41 2 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      Sustenaut: ${{ steps.plan.outputs.Sustenaut }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      - id: sustenaut
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_READER_APP_ID }}'
          private-key: '${{ secrets.RELEASE_READER_APP_KEY }}'
          owner: Sustenaut
      - id: plan
        run: |
          governed() {
            GH_TOKEN="$2" gh api -H 'Accept: application/vnd.github.raw+json' "repos/$1/release-state/contents/state.json" > state.json
            pubfleet state --repos-for govern state.json
          }
          echo "Sustenaut=$(governed Sustenaut "$SUSTENAUT_TOKEN")" >> "$GITHUB_OUTPUT"
        env:
          SUSTENAUT_TOKEN: '${{ steps.sustenaut.outputs.token }}'

  sustenaut:
    needs: plan
    if: needs.plan.outputs.Sustenaut != '{"repositories":[]}'
    uses: Sustenaut/pubfleet/.github/workflows/nightly.yml@80f051890749283c9f5bfc33f328e013be26c05e # v0.1.0
    with: { repos: '${{ needs.plan.outputs.Sustenaut }}' }
    secrets:
      app-id: '${{ vars.NIGHTLY_APP_ID }}'
      app-key: '${{ secrets.NIGHTLY_APP_KEY }}'
      notify-token: '${{ secrets.SUSTENAUT_SLACK_BOT_TOKEN }}'
      notify-user: '${{ secrets.SLACK_DM_USER_ID }}'

  # A variable changed by hand on GitHub, against what release-state gives it. This
  # only reports, to the operator: putting it back is a pull request to release-state,
  # or its apply run by hand. This repository is public and the state may name private
  # repositories, so what differs goes only to the operator's direct message, never
  # to the log. The token has every permission the reader app has, all
  # read only, since the action can't ask for the Variables permission by name.
  variables:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      - id: sustenaut
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_READER_APP_ID }}'
          private-key: '${{ secrets.RELEASE_READER_APP_KEY }}'
          owner: Sustenaut
      - id: check
        env: { GH_TOKEN: '${{ steps.sustenaut.outputs.token }}' }
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' repos/Sustenaut/release-state/contents/state.json > state.json
          if pubfleet variables --check --state state.json > variables.txt 2>&1; then status=same; else status=differ; fi
          echo "Variables: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Say a variable differs
        if: steps.check.outputs.status == 'differ'
        env:
          TOKEN: '${{ secrets.SUSTENAUT_SLACK_BOT_TOKEN }}'
          USER_ID: '${{ secrets.SLACK_DM_USER_ID }}'
          RUN: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |
          text="GitHub variables differ from Sustenaut/release-state, or couldn't be checked; changed by hand? Nothing was put back. $RUN
          $(grep -v '^ ' variables.txt | head -20)"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -n --arg c "$USER_ID" --arg t "$text" '{channel: $c, text: $t}')" > /dev/null

  # Each repository on the board against pubkit, every night, as facts: its pin against
  # pubkit's latest release, and main's sync check, passes as well as failures, one row
  # each (bin/pubkit-facts). They go to storage's private pubkit-checks buffer, which the
  # integrations ingest loads into BigQuery's platform.pubkit_checks, where observability's
  # pubkit_drift rule opens a signal on a failure and the notifier posts its fix. This
  # repository is public and the state may name private repositories, so the facts go
  # only to the private tenant; the log and the summary give counts.
  pubkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # storage takes the job's OpenID Connect token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      - id: sustenaut
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_READER_APP_ID }}'
          private-key: '${{ secrets.RELEASE_READER_APP_KEY }}'
          owner: Sustenaut
      - name: Check each repository, and keep the facts in storage
        env: { GH_TOKEN: '${{ steps.sustenaut.outputs.token }}' }
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' repos/Sustenaut/release-state/contents/state.json > state.json
          python bin/pubkit-facts state.json --url https://storage.sustenaut.eu --tenant pubkit-checks \
            | tee -a "$GITHUB_STEP_SUMMARY"
