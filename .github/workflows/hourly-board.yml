# Every hour, for each owner: grade what its state.json puts on the board with
# pubkit, and keep the result in storage if a fact or a grade changed. This
# repository is public and the state may name private repositories, so this job
# keeps its logs quiet and uploads no artifact: the board goes only to storage.
name: board

on:
  schedule: [{ cron: '13 * * * *' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board:
    name: board (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # storage takes the job's OpenID Connect token
    concurrency: { group: 'board-${{ matrix.owner }}', cancel-in-progress: false }
    strategy:
      fail-fast: false
      matrix:
        owner: [Sustenaut, schryer]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      # The reader app can only read, and this token covers this owner alone.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_READER_APP_ID }}'
          private-key: '${{ secrets.RELEASE_READER_APP_KEY }}'
          owner: '${{ matrix.owner }}'
      - name: Grade the owner's repositories
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$OWNER/release-state/contents/state.json" > state.json
          scripts/repos-from-state.py board < state.json > repos.json
          pubkit board --out site --repos repos.json > /dev/null
        env:
          OWNER: '${{ matrix.owner }}'
          GH_TOKEN: '${{ steps.app.outputs.token }}'
          GITHUB_TOKEN: '${{ steps.app.outputs.token }}'
          SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}'
      - name: Keep it in storage, if it changed
        run: scripts/publish-board.py "$OWNER" site/board.json
        env: { OWNER: '${{ matrix.owner }}' }
