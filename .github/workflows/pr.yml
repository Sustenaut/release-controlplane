# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"shellcheck": "with-secrets"}

  tests:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-tests.yml@2edf28ec3cc49866fe505d783ed811bcfb16f432 # v0.23.2
    with: {"setup": "make venv", "test": "make functional"}

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
