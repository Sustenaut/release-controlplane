# The release control plane's app on the Sustenaut k3s server (business-plan's
# infra/hetzner.tf), namespace release: the app, oauth2-proxy in front of it, and the
# ingress for release.sustenaut.eu. Rendered by .github/workflows/deploy.yml with the
# image it just built, and applied by sustenaut-deploy on the server.
# Not here: the Secrets release-secrets and release-oidc (the sign-in client) and the
# network policy in admin/, which the deploy identity may not manage: pubkit's deploy
# walk puts them in (README.md, "Deploying").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: release
resources:
  - service-accounts.yaml
  - app.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
# The app's hardening and probes, shared by every service (pubkit's README, "Deploying a
# service to k3s"); k8s-schryer gets them through this directory.
components:
  - https://github.com/Sustenaut/pubkit//k8s/components/app?ref=c7785ba2f32bd5c5a78053e9bfeaa1f966ae36f1 # v0.30.0
images:
  - name: ghcr.io/sustenaut/sustenaut-release
    newTag: unset
