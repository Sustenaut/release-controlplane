apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  template:
    spec:
      containers:
        - name: oauth2-proxy
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.sustenaut.eu/realms/family
            - --code-challenge-method=S256
            - --scope=openid email profile
            - --http-address=0.0.0.0:4180
            - --upstream=http://app:8080/
            - --redirect-url=https://release.schryer.eu/oauth2/callback
            - --reverse-proxy=true
            - --authenticated-emails-file=/etc/oauth2-proxy/emails
            - --pass-user-headers=true
            - --cookie-name=_release
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --skip-auth-route=GET=^/healthz$
            - --silence-ping-logging=true
          volumeMounts:
            - name: emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: emails
          secret:
            secretName: release-secrets
            items:
              - key: allowed-emails-file
                path: emails
