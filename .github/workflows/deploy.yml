# Build and deploy the app (release.sustenaut.eu) on each merge to main, or by hand.
# The image goes to GitHub's container registry and holds no secrets. Then the manifests
# in k8s/, rendered with that image, go to the Sustenaut k3s server (business-plan's
# infra/hetzner.tf) over SSH, where the deploy key can only run sustenaut-deploy: apply
# in namespace release and wait. SSH is reachable over Sustenaut's tailnet only, so the
# job joins it first, as tag:ci.
#
# The deploy secrets and variables are in this repository's server environment, which
# only main may use, because this repository is public. Without SUSTENAUT_SERVER the
# image is built and pushed, and nothing is deployed.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sustenaut/sustenaut-release

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }

      - name: Build the image
        run: docker build -t "${IMAGE}:${GITHUB_SHA}" .

      # The image must start and hold what the app imports, and no tests.
      - name: Check the image
        run: |
          docker run --rm "${IMAGE}:${GITHUB_SHA}" node -e '
            import("./app/server.js").then(() => import("pubpr")).then(() => {
              if (require("node:fs").existsSync("app/test")) throw new Error("tests in the image");
            })'

      - name: Push the image
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "${IMAGE}:${GITHUB_SHA}"
        env:
          TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ACTOR: '${{ github.actor }}'

      - name: Render the manifests
        working-directory: k8s
        run: |
          kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}"
          kustomize build . > "${RUNNER_TEMP}/release.yaml"
          grep -q "${IMAGE}:${GITHUB_SHA}" "${RUNNER_TEMP}/release.yaml"

      - name: Join Sustenaut's tailnet
        if: vars.SUSTENAUT_SERVER != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: '${{ secrets.TS_GH_OAUTH_CLIENT_ID }}'
          oauth-secret: '${{ secrets.TS_GH_OAUTH_SECRET }}'
          tags: tag:ci

      - name: Deploy to the k3s server
        if: vars.SUSTENAUT_SERVER != ''
        env:
          DEPLOY_KEY: '${{ secrets.SUSTENAUT_DEPLOY_SSH_KEY }}'
          KNOWN_HOSTS: '${{ vars.SUSTENAUT_KNOWN_HOSTS }}'
          SERVER: '${{ vars.SUSTENAUT_SERVER }}'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@${SERVER}" release < "${RUNNER_TEMP}/release.yaml"
